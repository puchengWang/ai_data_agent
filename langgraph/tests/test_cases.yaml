cases:
  - name: normal_user_count
    question: "2026-05-14 新增用户数量是多少？"
    expected_aggregation_type: normal
    expected_operators: []
    expected_sql_keywords:
      - COUNT
      - WHERE

  - name: compare_user_count
    question: "2026-05-14 新增用户相比前一天增长多少？"
    expected_aggregation_type: compare
    expected_operators:
      - growth_rate
    expected_sql_keywords:
      - COUNT
      - WHERE

  - name: trend_user_count
    question: "统计 2026-05-08 到 2026-05-14 每天新增用户趋势"
    expected_aggregation_type: trend
    expected_operators:
      - peak_valley
      - volatility
      - basic_anomaly
    expected_sql_keywords:
      - COUNT
      - WHERE

  - name: group_by_level
    question: "统计 2026-05-14 按用户等级的新增用户数量"
    expected_aggregation_type: group_by
    expected_operators:
      - contribution
    expected_sql_keywords:
      - GROUP BY level

  - name: top_n_level
    question: "统计 2026-05-14 新增用户最多的前3个用户等级"
    expected_aggregation_type: top_n
    expected_operators:
      - contribution
    expected_sql_keywords:
      - GROUP BY level
      - LIMIT 3

  - name: distribution_level
    question: "统计 2026-05-14 新增用户的用户等级分布"
    expected_aggregation_type: distribution
    expected_operators:
      - contribution
    expected_sql_keywords:
      - GROUP BY level

  - name: compare_by_dimension_level
    question: "2026-05-14 各用户等级相比前一天新增用户增长多少？"
    expected_aggregation_type: compare_by_dimension
    expected_operators:
      - growth_rate
    expected_sql_keywords:
      - GROUP BY level

  - name: trend_by_dimension_level
    question: "统计 2026-05-08 到 2026-05-14 各用户等级新增用户趋势"
    expected_aggregation_type: trend_by_dimension
    expected_operators:
      - peak_valley
      - volatility
      - basic_anomaly
    expected_sql_keywords:
      - GROUP BY level